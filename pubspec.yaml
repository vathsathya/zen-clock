name: zen_clock
description: "Ultra-Lightweight Zen Digital Clock for Windows, Linux, and Android"
publish_to: 'none'
version: 1.0.5+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.5.2
  window_manager: ^0.5.2
  tray_manager: ^0.5.3
  screen_retriever: ^0.2.2
  wakelock_plus: ^1.2.8
  google_fonts: ^6.2.1
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/khmer_proverbs.json
    - assets/icons/app_icon.png
