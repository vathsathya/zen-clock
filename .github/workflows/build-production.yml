name: Build Production Artifacts

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build Linux Desktop & .deb Installer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++6 \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            libglib2.0-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            dpkg-dev

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux Release
        run: flutter build linux --release

      - name: Compress Linux Portable Archive
        run: tar -czvf zen-clock-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Build Ubuntu .deb Installer Package
        run: |
          chmod +x packaging/linux/build_deb.sh
          ./packaging/linux/build_deb.sh

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zen-clock-linux-packages
          path: |
            zen-clock-linux-x64.tar.gz
            zen-clock_*.deb

  build-windows:
    name: Build Windows Desktop & .exe Installer
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Pub\Cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Compress Windows Portable ZIP
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath zen-clock-windows-x64.zip -CompressionLevel Fastest

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows Setup .exe Installer (Inno Setup)
        run: iscc windows/installer/zen_clock_setup.iss

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zen-clock-windows-packages
          path: |
            zen-clock-windows-x64.zip
            ZenClock-Setup-*.exe

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android APK Release
        run: |
          flutter build apk --release
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            cp build/app/outputs/flutter-apk/app-release.apk "zen-clock-${TAG_NAME}.apk"
          else
            cp build/app/outputs/flutter-apk/app-release.apk zen-clock-android-release.apk
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zen-clock-android-apk
          path: zen-clock-*.apk

  build-web:
    name: Build Web Production PWA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Web Release
        run: |
          flutter build web --release
          tar -czvf zen-clock-web.tar.gz -C build/web .

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zen-clock-web-package
          path: zen-clock-web.tar.gz

  release:
    name: Create GitHub Release
    needs: [build-linux, build-windows, build-android, build-web]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            zen-clock-linux-packages/zen-clock-linux-x64.tar.gz
            zen-clock-linux-packages/*.deb
            zen-clock-windows-packages/zen-clock-windows-x64.zip
            zen-clock-windows-packages/ZenClock-Setup-*.exe
            zen-clock-android-apk/zen-clock-*.apk
            zen-clock-web-package/zen-clock-web.tar.gz
